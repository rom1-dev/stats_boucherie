<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil du joueur</title>
    <!-- On réutilise le même style CSS global -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-header-btns">
        <a href="index.html" class="back-btn">← Retour à la liste des joueurs</a>
        <a href="hall_of_fame.html" class="nav-btn">🏆 Hall of Fame</a>
    </div>
    
    <h1 id="player-title">Chargement...</h1>

    <!-- Filtres On/Off globaux -->
    <div class="toggle-filters-container">
        <label class="toggle-filter">
            <input type="checkbox" id="toggle-unknown">
            <span class="toggle-switch"></span>
            <span class="toggle-label">Joueurs Inconnus</span>
        </label>
        <label class="toggle-filter">
            <input type="checkbox" id="toggle-bots">
            <span class="toggle-switch"></span>
            <span class="toggle-label">Bots</span>
        </label>
    </div>

    <div class="player-profile-header">
        <img id="skin-avatar" alt="Avatar du joueur" onerror="imageErreur(this)"/>
        <img id="skin-iso" alt="Tête du joueur" onerror="imageErreur(this)"/>
        <img id="skin-body" alt="Corps du joueur" onerror="imageErreur(this)"/>
        <img id="skin-bust" alt="Buste du joueur" onerror="imageErreur(this)"/>
        <img id="skin" alt="skin du joueur" onerror="imageErreur(this)"/>
    </div>

    <!-- Section Médailles du joueur -->
    <div id="player-medals-container" class="category-section" style="margin: 0 auto 30px auto;">
        <div class="category-header" style="cursor: default;">
            <h2>🏅 Podiums & Médailles</h2>
        </div>
        <div class="category-content">
            <div id="medals-content" style="display: flex; justify-content: center; gap: 30px; font-size: 1.1rem; color: #a8a8b3;">
                <span>🥇 Or : <strong id="gold-count" style="color: #ffffff;">0</strong></span>
                <span>🥈 Argent : <strong id="silver-count" style="color: #ffffff;">0</strong></span>
                <span>🥉 Bronze : <strong id="bronze-count" style="color: #ffffff;">0</strong></span>
            </div>
        </div>
    </div>

    <script>
        function imageErreur(img) {
            img.parentElement.classList.add("hidden");
            img.onerror = null; 
        }
    </script>
    
    <div id="player-stats">
        <!-- Les stats injectées par player.js arriveront ici -->
    </div>

    <script src="player.js" type="module" defer></script>
</body>
</html>
