<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil du joueur</title>
    <!-- On réutilise le même style CSS global -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-header-btns">
        <a href="index.html" class="back-btn">← Retour à la liste des joueurs</a>
        <a href="hall_of_fame.html" class="nav-btn">🏆 Hall of Fame</a>
    </div>
    
    <h1 id="player-title">Chargement...</h1>

    <div class="player-profile-header">
        <img id="skin-avatar" alt="Avatar du joueur" onerror="imageErreur(this)"/>
        <img id="skin-iso" alt="Tête du joueur" onerror="imageErreur(this)"/>
        <img id="skin-body" alt="Corps du joueur" onerror="imageErreur(this)"/>
        <img id="skin-bust" alt="Buste du joueur" onerror="imageErreur(this)"/>
        <img id="skin" alt="skin du joueur" onerror="imageErreur(this)"/>
    </div>

    <script>
        function imageErreur(img) {
            img.parentElement.classList.add("hidden");
            // Éviter une boucle infinie si l'image de secours échoue aussi
            img.onerror = null; 
        }
    </script>
    
    <div id="player-stats">
        <!-- Les stats injectées par player.js arriveront ici -->
    </div>

    <script src="player.js" type="module" defer></script>
</body>
</html>
