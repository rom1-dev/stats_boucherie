<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Liste des Joueurs</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="nav-header-btns">
            <a href="hall_of_fame.html" class="nav-btn">🏆 Hall of Fame</a>
        </div>
        
        <h1>Liste des Joueurs</h1>

        <!-- Filtres On/Off -->
        <div class="toggle-filters-container">
            <label class="toggle-filter">
                <input type="checkbox" id="toggle-unknown">
                <span class="toggle-switch"></span>
                <span class="toggle-label">Joueurs Inconnus</span>
            </label>
            <label class="toggle-filter">
                <input type="checkbox" id="toggle-bots">
                <span class="toggle-switch"></span>
                <span class="toggle-label">Bots</span>
            </label>
        </div>

        <!-- Section Liste des Joueurs (Réductible) -->
        <div id="players-section" class="category-section" style="margin-bottom: 30px;">
            <div class="category-header" id="players-header">
                <h2 style="margin-bottom: 0;">👥 Liste des Joueurs</h2>
                <button class="toggle-btn" id="players-toggle-btn">
                    <span class="toggle-text">Réduire</span>
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="category-content">
                <input type="text" id="search-bar" placeholder="Rechercher un joueur..." style="margin-top: 20px;">
                <ul id="player-list" style="margin-top: 10px;">
                    <li>Chargement des joueurs...</li>
                </ul>
            </div>
        </div>

        <!-- Section des statistiques et podiums globaux -->
        <div id="global-records-section" style="display: flex; flex-direction: column; gap: 30px; margin-bottom: 20px;">
            
            <!-- Statistiques Custom Clés du Serveur (Réductible) -->
            <div id="custom-stats-section" class="category-section">
                <div class="category-header" id="custom-stats-header">
                    <h2 style="margin-bottom: 0;">🌍 Statistiques Clés du Serveur</h2>
                    <button class="toggle-btn" id="custom-stats-toggle-btn">
                        <span class="toggle-text">Réduire</span>
                        <span class="toggle-icon">▼</span>
                    </button>
                </div>
                <div class="category-content">
                    <div id="custom-server-stats-grid" class="flat-stats-grid" style="justify-content: center; margin-top: 10px;">
                        <p style="color: #a8a8b3; text-align: center; width: 100%;">Calcul des statistiques clés...</p>
                    </div>
                </div>
            </div>

            <!-- Top 3 par Catégorie (Réductible) -->
            <div class="category-section" id="top-categories-section">
                <div class="category-header" id="top-categories-header">
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-right: 15px;">
                        <h2 style="margin-bottom: 0;">🏆 Classement Serveur par Catégorie</h2>
                    </div>
                    <button class="toggle-btn" id="top-categories-toggle-btn">
                        <span class="toggle-text">Réduire</span>
                        <span class="toggle-icon">▼</span>
                    </button>
                </div>
                <div class="category-content">
                    <div onclick="event.stopPropagation();" style="display: flex; align-items: center; gap: 8px;">
                        <label for="top-limit-input" style="font-size: 0.85rem; color: #a8a8b3;">Afficher le top :</label>
                        <input type="number" id="top-limit-input" value="5" min="1" max="1000" class="category-search" style="margin-bottom: 10px; width: 80px; padding: 6px 10px; font-size: 0.85rem; text-align: center;">
                    </div>
                    
                    <!-- NOUVELLE BARRE DE RECHERCHE GLOBALE POUR TOUTES LES CATÉGORIES -->
                    <input type="text" id="global-categories-search" placeholder="Rechercher un item/statistique dans toutes les catégories..." class="category-search">

                    <div id="global-records-grid" class="category-grid" style="margin-top: 10px;">
                        <p style="color: #a8a8b3; text-align: center; width: 100%;">Calcul des tops du serveur...</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Section Comparateur de Joueurs -->
        <div class="category-section" id="comparator-section" style="margin-bottom: 30px;">
            <div class="category-header" id="comparator-header">
                <h2 style="margin-bottom: 0;">⚔️ Comparateur de Joueurs</h2>
                <button class="toggle-btn" id="comparator-toggle-btn">
                    <span class="toggle-text">Réduire</span>
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="category-content">
                <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; align-items: center;">
                    
                    <!-- Joueur 1 avec suggestions -->
                    <div style="flex: 1; min-width: 200px;">
                        <input type="text" id="compare-player-1" list="players-suggestions" placeholder="Entrer le pseudo du joueur 1..." class="category-search" style="margin-bottom: 0;">
                    </div>

                    <!-- Joueur 2 avec suggestions -->
                    <div style="flex: 1; min-width: 200px;">
                        <input type="text" id="compare-player-2" list="players-suggestions" placeholder="Entrer le pseudo du joueur 2..." class="category-search" style="margin-bottom: 0;">
                    </div>

                    <button id="launch-compare-btn" class="nav-btn" style="padding: 10px 24px;">Comparer</button>
                </div>

                <!-- Datalist partagée pour les suggestions dynamiques -->
                <datalist id="players-suggestions"></datalist>

                <!-- Résultat de la comparaison -->
                <div id="comparator-results" style="display: none;">
                    <div id="comparator-summary" style="background: #121214; padding: 15px; border-radius: 8px; border: 1px solid #29292e; margin-bottom: 20px; text-align: center; font-size: 1.1rem;">
                        <!-- Le récapitulatif du vainqueur s'affichera ici -->
                    </div>
                    <div id="comparator-grid" class="category-grid">
                        <!-- Les lignes de stats comparatives s'afficheront ici -->
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js" type="module"></script>
        
    </body>
</html>
