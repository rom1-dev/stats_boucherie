<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame</title>
    <!-- On réutilise le même style CSS global -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-header-btns">
        <p><a href="index.html" class="back-btn">← Retour à la liste des joueurs</a></p>
    </div>

    <h1>Hall of Fame</h1>

    <!-- Section du Classement Global des Médailles (Réductible) -->
    <div id="global-medals-ranking" class="category-section" style="margin-bottom: 30px;">
        <div class="category-header" id="medals-ranking-header">
            <h2 style="margin-right: 10px;">🏅 Classement Général des Médailles</h2>
            <button class="toggle-btn" id="medals-toggle-btn">
                <span class="toggle-text">Réduire</span>
                <span class="toggle-icon">▼</span>
            </button>
        </div>
        <div class="category-content" id="medals-ranking-content">
            <div id="global-medals-list" style="display: flex; flex-direction: column; gap: 8px;">
                <p style="text-align: center; color: #a8a8b3;">Chargement du classement...</p>
            </div>
        </div>
    </div>

    <!-- Nombre dans le top -->
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 20px;">
        <label for="hof-limit-input" style="font-size: 0.9rem; color: #a8a8b3;">Afficher le top :</label>
        <input type="number" id="hof-limit-input" value="5" min="1" max="1000" class="category-search" style="margin-bottom: 0; width: 80px; padding: 6px 10px; text-align: center;">
    </div>

    <!-- Filtres On/Off -->
    <div class="toggle-filters-container">
        <label class="toggle-filter">
            <input type="checkbox" id="toggle-unknown">
            <span class="toggle-switch"></span>
            <span class="toggle-label">Joueurs Inconnus</span>
        </label>
        <label class="toggle-filter">
            <input type="checkbox" id="toggle-bots">
            <span class="toggle-switch"></span>
            <span class="toggle-label">Bots</span>
        </label>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
        <!-- Recherche globale par catégorie / nom de stat -->
        <input type="text" id="search-bar" placeholder="Rechercher une statistique..." class="category-search" style="flex: 1; min-width: 250px; margin-bottom: 0;">
        
        <!-- Nouvelle barre dédiée pour rechercher un joueur spécifique -->
        <input type="text" id="player-search-bar" placeholder="Filtrer par pseudo (ex: Steve)..." class="category-search" style="flex: 1; min-width: 250px; margin-bottom: 0;">
    </div>

    <div id="hall-of-fame-container">
        <!-- Les podiums du Top seront injectés ici dynamiquement -->
    </div>

    <script src="hall_of_fame.js" type="module" defer></script>
</body>
</html>
